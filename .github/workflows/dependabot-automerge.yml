name: Dependabot auto-merge

# Runs only after the CI workflow has finished
on:
  workflow_run:
    workflows: ["Build application"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Merge only Dependabot PRs whose CI run succeeded completely:
    # Python build + lint + tests (job "build") AND frontend build (job "frontend")
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # --match-head-commit: only merge exactly the commit that was tested
      - run: gh pr merge "$BRANCH" --squash --match-head-commit "$SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
