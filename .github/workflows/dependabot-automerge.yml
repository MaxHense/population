name: Dependabot auto-merge

# Hourly: merge Dependabot PRs that are open for 2+ days and fully green.
# Dependabot "cooldown" only delays opening the PR, this delays the merge.
on:
  schedule:
    - cron: "17 * * * *"   # hourly, so a PR merges ~2 days after opening, not up to 3
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          merged=0
          for pr in $(gh pr list --author app/dependabot --state open --json number,createdAt \
                       --jq ".[] | select(.createdAt < \"$cutoff\") | .number"); do
            # non-zero exit if a check failed or is still pending
            gh pr checks "$pr" > /dev/null || { echo "#$pr: checks not green, skip"; continue; }
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            # conflict after an earlier merge: skip, Dependabot rebases, next run merges
            gh pr merge "$pr" --squash --match-head-commit "$sha" && merged=1 || echo "#$pr: merge failed, skip"
          done
          # merges via GITHUB_TOKEN trigger no push event, so run CI on main explicitly
          if [ "$merged" = 1 ]; then gh workflow run "Build application" --ref main; fi
