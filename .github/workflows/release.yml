name: Release image

# A tag v* builds the image, smoke tests it against PostGIS and only then
# publishes it to ghcr.io with a provenance attestation.
# Deployments pin the printed digest, never the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # sign the attestation
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build
      id: build
      run: |
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        docker build -t "$image:$GITHUB_REF_NAME" \
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" .

    - name: Smoke test (migrations on a fresh PostGIS, one query)
      env:
        IMAGE: ${{ steps.build.outputs.image }}
      run: |
        docker network create smoke
        docker run -d --name db --network smoke -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=population \
          "$(grep -m1 'image: postgis' compose.yaml | awk '{print $2}')"
        until docker exec db pg_isready -h 127.0.0.1 -U postgres -d population; do sleep 1; done
        docker run -d --name api --network smoke -p 8000:8000 \
          -e DBURL=postgresql+psycopg://postgres:postgres@db:5432/population "$IMAGE:$GITHUB_REF_NAME"
        for _ in $(seq 60); do
          if curl -sf -X POST localhost:8000/ -H 'Content-Type: application/json' \
               -d '{"polygon_srid": 4326, "polygon": "POLYGON ((6.9 50.9, 7 50.9, 7 51, 6.9 50.9))"}'; then
            exit 0
          fi
          sleep 1
        done
        docker logs api
        exit 1

    - name: Push
      id: push
      env:
        IMAGE: ${{ steps.build.outputs.image }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker push "$IMAGE:$GITHUB_REF_NAME"
        digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_REF_NAME" | cut -d@ -f2)"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Image: \`$IMAGE:$GITHUB_REF_NAME@$digest\`" >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.build.outputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
